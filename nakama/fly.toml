# Bid Rush Nakama on Fly.io
# Deploy from repo root:
#   fly deploy . --config nakama/fly.toml --dockerfile nakama/Dockerfile

app = "bid-rush-nakama"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NAKAMA_NODE_NAME = "bid-rush"
  NAKAMA_LOG_LEVEL = "INFO"
  NAKAMA_SESSION_EXPIRY = "7200"

# Client API + WebSocket (Nakama HTTP gateway)
[[services]]
  protocol = "tcp"
  internal_port = 7350
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/"

# Optional: Nakama console (protect with strong password; prefer SSH tunnel later)
[[services]]
  protocol = "tcp"
  internal_port = 7351
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8081
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
