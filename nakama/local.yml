name: bid-rush
console:
  max_message_size_bytes: 409600
logger:
  level: "INFO"
runtime:
  js_entrypoint: "build/index.js"
session:
  token_expiry_sec: 7200
socket:
  # Game snapshots can be large - keep above typical GameState JSON size
  max_message_size_bytes: 131072
  max_request_size_bytes: 262144
matchmaker:
  max_tickets: 4
  interval_sec: 1
  max_intervals: 15
